name: Validate tests

on:
  push:
    branches:
      - main
      - "389-ds-base-*"
    paths-ignore:
      - '**.md'
      # not docs/**: slapi.doxy.in and the doxygen assets are build inputs
      - 'docs/agents/**'
      - 'docs/design/**'
      - 'LICENSE*'
      - '.packit.yaml'
      - '.github/renovate.json'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/agents/**'
      - 'docs/design/**'
      - 'LICENSE*'
      - '.packit.yaml'
      - '.github/renovate.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  packages: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: quay.io/389ds/ci-images:test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run testimony
        if: always()
        run: testimony validate -c dirsrvtests/testimony.yaml dirsrvtests/tests/suites

      - name: Check for duplicate IDs
        if: always()
        run: python3 dirsrvtests/check_for_duplicate_ids.py dirsrvtests/tests/suites
