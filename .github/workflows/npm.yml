name: npm-audit-ci

on:
  push:
    branches:
      - main
      - "389-ds-base-*"
    paths-ignore:
      - '**.md'
      # not docs/**: slapi.doxy.in and the doxygen assets are build inputs
      - 'docs/agents/**'
      - 'docs/design/**'
      - 'LICENSE*'
      - '.packit.yaml'
      - '.github/renovate.json'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/agents/**'
      - 'docs/design/**'
      - 'LICENSE*'
      - '.packit.yaml'
      - '.github/renovate.json'
  schedule:
    - cron:  '0 0 * * *'

jobs:
  npm-audit-ci:
    name: npm-audit-ci
    runs-on: ubuntu-latest
    container:
      image: quay.io/389ds/ci-images:test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run NPM Audit CI
        run: cd $GITHUB_WORKSPACE/src/cockpit/389-console && npx --yes audit-ci --config audit-ci.json
