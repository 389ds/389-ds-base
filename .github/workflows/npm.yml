name: npm-audit-ci

on:
  push:
    branches:
      - main
      - "389-ds-base-*"
    paths-ignore:
      - '**.md'
      # not docs/**: slapi.doxy.in and the doxygen assets are build inputs
      - 'docs/agents/**'
      - 'docs/design/**'
      - 'LICENSE*'
      - '.packit.yaml'
      - '.github/renovate.json'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/agents/**'
      - 'docs/design/**'
      - 'LICENSE*'
      - '.packit.yaml'
      - '.github/renovate.json'
  schedule:
    # No sha gate on this nightly: audit-ci results drift with the npm
    # advisory database even when the tree is unchanged.
    - cron:  '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  packages: read
  contents: read

jobs:
  npm-audit-ci:
    name: npm-audit-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: quay.io/389ds/ci-images:test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run NPM Audit CI
        run: cd $GITHUB_WORKSPACE/src/cockpit/389-console && npx --yes audit-ci --config audit-ci.json
